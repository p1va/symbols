language-servers:
  typescript:
    # TypeScript 7's native Go language server.
    command: npx -y -p typescript@^7.0.2 tsc --lsp --stdio
    # These files identify a TypeScript/JavaScript workspace for routing and workspace-wide search.
    workspace_files:
      - 'tsconfig.json'
      - 'jsconfig.json'
    diagnostics:
      strategy: 'pull'

  pyright:
    # npm install -g pyright if you prefer to install globally
    # command: pyright-langserver --stdio
    command: npx -y -p pyright pyright-langserver --stdio
    workspace_files:
      - 'pyproject.toml'
      - 'requirements.txt'
      - 'setup.py'
      - 'Pipfile'
    diagnostics:
      strategy: 'pull'

  # go:
