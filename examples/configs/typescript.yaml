language-servers:
  typescript:
    command: npx -y -p typescript@^7.0.2 tsc --lsp --stdio
    extensions:
      .js: javascript
      .mjs: javascript
      .cjs: javascript
      .jsx: javascriptreact
      .ts: typescript
      .mts: typescript
      .cts: typescript
      .tsx: typescriptreact
      .json: json
      .jsonc: json
    workspace_files:
      - 'tsconfig.json'
      - 'jsconfig.json'
    diagnostics:
      strategy: 'pull'
